# Read the Docs configuration.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc # nbsphinx shells out to pandoc to render the tutorial notebooks
  jobs:
    post_create_environment:
      - pip install uv
    post_install:
      # --active installs into the virtualenv Read the Docs created rather than a
      # fresh .venv; --inexact leaves RTD's own preinstalled packages alone.
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH uv sync --group docs --frozen --active --inexact
    pre_build:
      # docs/source/ is generated, not committed: the tutorials live in examples/ and
      # are mirrored in, and sphinx-apidoc writes the API stubs.
      - mkdir -p docs/source/examples
      - cp -r examples/* docs/source/examples/
      - sphinx-apidoc -f -o docs/source/ pcx/

sphinx:
  configuration: docs/conf.py
